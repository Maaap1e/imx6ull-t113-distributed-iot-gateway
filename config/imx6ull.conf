# i.MX6ULL runtime configuration. Environment variables may override defaults.
T113_IP="${T113_IP:-192.168.3.32}"
TCP_PORT="${TCP_PORT:-5000}"
SAMPLE_INTERVAL_MS="${SAMPLE_INTERVAL_MS:-500}"

CAN_IFACE="${CAN_IFACE:-can0}"
CAN_BITRATE="${CAN_BITRATE:-500000}"
OTA_LOCK="${OTA_LOCK:-/tmp/stm32_can_ota.lock}"

AP3216C_SYSFS_DIR="${AP3216C_SYSFS_DIR:-/sys/class/misc/ap3216c}"
AP3216C_DEVICE="${AP3216C_DEVICE:-/dev/ap3216c}"
ICM20608_DEVICE="${ICM20608_DEVICE:-/dev/icm20608}"

STM32_CAN_STATE="${STM32_CAN_STATE:-/tmp/stm32_can_state.json}"
STM32_CAN_CSV="${STM32_CAN_CSV:-/tmp/stm32_can_data.csv}"
STM32_CAN_LOG="${STM32_CAN_LOG:-/tmp/stm32_can_client.log}"
STM32_CAN_PID="${STM32_CAN_PID:-/tmp/stm32_can_client.pid}"

GATEWAY_STATE="${GATEWAY_STATE:-/tmp/imx6ull_gateway_state.json}"
GATEWAY_LOG="${GATEWAY_LOG:-/tmp/imx6ull_gateway.log}"
GATEWAY_PID="${GATEWAY_PID:-/tmp/imx6ull_gateway_app.pid}"

# MQTT northbound bridge. Disabled by default; enable only after configuring a
# trusted Broker. The Tongxinmao values below are for public smoke tests.
MQTT_ENABLE="${MQTT_ENABLE:-0}"
MQTT_BROKER_URI="${MQTT_BROKER_URI:-tcp://mq.tongxinmao.com:18830}"
MQTT_CLIENT_ID="${MQTT_CLIENT_ID:-Maaap1e-imx6ull-01}"
MQTT_TOPIC_PREFIX="${MQTT_TOPIC_PREFIX:-/public/TEST/Maaap1e/imx6ull-01}"
MQTT_STATE_FILE="${MQTT_STATE_FILE:-$GATEWAY_STATE}"
MQTT_PUBLISH_INTERVAL_SECONDS="${MQTT_PUBLISH_INTERVAL_SECONDS:-5}"
MQTT_LED_DIR="${MQTT_LED_DIR:-/sys/class/leds/sys-led}"
MQTT_USERNAME="${MQTT_USERNAME:-}"
MQTT_PASSWORD="${MQTT_PASSWORD:-}"
MQTT_LOG="${MQTT_LOG:-/tmp/mqtt_bridge.log}"
MQTT_PID="${MQTT_PID:-/tmp/mqtt_bridge.pid}"

MAINTENANCE_PID="${MAINTENANCE_PID:-/tmp/iot_gateway_maintenance.pid}"
SUPERVISOR_PID="${SUPERVISOR_PID:-/tmp/iot_gateway_supervisor.pid}"
SUPERVISOR_LOG="${SUPERVISOR_LOG:-/tmp/imx6ull_supervisor.log}"
SUPERVISOR_INTERVAL_SECONDS="${SUPERVISOR_INTERVAL_SECONDS:-5}"

LOG_MAX_BYTES="${LOG_MAX_BYTES:-1048576}"
LOG_KEEP="${LOG_KEEP:-2}"
CSV_MAX_BYTES="${CSV_MAX_BYTES:-5242880}"
CSV_KEEP="${CSV_KEEP:-2}"
MAINTENANCE_INTERVAL_SECONDS="${MAINTENANCE_INTERVAL_SECONDS:-60}"
